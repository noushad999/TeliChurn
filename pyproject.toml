[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn"
version = "2.0.0"
description = "Prepaid mobile subscriber churn prediction: data simulation, feature pipeline, LightGBM, reason codes, campaign targeting, API and drift monitoring."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Md Noushad Jahan Ramim" }]
license = { text = "Proprietary. All rights reserved. See LICENSE." }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=14",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]
sql = ["connectorx>=0.3"]
dashboard = ["streamlit>=1.35"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
