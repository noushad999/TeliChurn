apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  labels: {app: churn-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: churn-api}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: churn-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: telco-churn
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: CHURN_CONFIG, value: /etc/churn/config.yaml}
            - {name: CHURN_MODEL_DIR, value: /app/artifacts/model}
            - {name: CHURN_SCORES, value: /app/outputs/scores_latest.parquet}
            - {name: WEB_CONCURRENCY, value: "2"}
            - name: CHURN_API_KEYS
              valueFrom: {secretKeyRef: {name: churn-secrets, key: CHURN_API_KEYS}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/churn}
            - {name: store, mountPath: /app/artifacts, subPath: artifacts, readOnly: true}
            - {name: store, mountPath: /app/outputs, subPath: outputs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: churn-config}
        - name: store
          persistentVolumeClaim: {claimName: churn-store}
        - name: tmp
          emptyDir: {}
